<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casino Zeus · Administrador Zeta</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #080b10; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; color: #fff; font: 16px/1.5 Arial, sans-serif; }
    #casino { display: block; flex: 1 1 auto; width: 100%; min-height: 0; border: 0; }
    .barra-contacto { flex: 0 0 auto; padding: 10px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: #10171f; text-align: center; }
    .administrador { margin: 0 0 7px; font-size: 13px; }
    .crear-usuario { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 600px; min-height: 54px; margin: 0 auto; padding: 12px 18px; border-radius: 10px; background: #28df83; color: #062715; font-size: 18px; font-weight: bold; text-decoration: none; touch-action: manipulation; }
    .crear-usuario svg { flex: 0 0 24px; width: 24px; height: 24px; fill: currentColor; }
    .crear-usuario:active { transform: scale(.99); }
    .crear-usuario:focus-visible { outline: 3px solid #4be5f6; outline-offset: 3px; }
    .aviso { margin: 8px 0 0; font-size: 13px; }
    .aviso[hidden] { display: none; }
  </style>
</head>
<body>
  <iframe id="casino" title="Casino Zeus" loading="eager"
    src="https://casinozeus.life/"
    sandbox="allow-scripts allow-same-origin allow-forms"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <footer class="barra-contacto" aria-label="Contacto con el Administrador Zeta">
    <p class="administrador">Administrador <strong>Zeta</strong></p>
    <a id="contacto" class="crear-usuario"
      href="whatsapp://send?text=Hola%20administrador%20Zeta%2C%20me%20puedes%20pasar%20informacion.&amp;phone=5492996820589"
      aria-label="Crear usuario por WhatsApp con el Administrador Zeta">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.52 3.48A11.91 11.91 0 0 0 12.04 0C5.43 0 .05 5.38.05 12a11.9 11.9 0 0 0 1.6 5.97L0 24l6.17-1.62a12 12 0 0 0 5.87 1.49h.01C18.66 23.87 24 18.49 24 11.88a11.8 11.8 0 0 0-3.48-8.4ZM12.04 21.85a9.96 9.96 0 0 1-5.08-1.39l-.36-.21-3.66.96.98-3.57-.24-.37a9.95 9.95 0 0 1-1.52-5.28c0-5.5 4.47-9.98 9.98-9.98 2.67 0 5.18 1.04 7.06 2.93a9.88 9.88 0 0 1 2.92 7.04c0 5.5-4.53 9.87-10.08 9.87Zm5.48-7.48c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.39-1.46-.88-.79-1.47-1.76-1.64-2.06-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.88 1.22 3.08c.15.2 2.1 3.21 5.09 4.5.71.31 1.26.5 1.69.64.71.23 1.35.2 1.86.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/>
      </svg>
      <span>Crear usuario</span>
    </a>
    <p id="respaldo" class="aviso" hidden role="status" aria-live="polite">Si WhatsApp no se abrió, tocá «Crear usuario» para hablar con Zeta.</p>
  </footer>

  <script>
    (function () {
      'use strict';

      // Mismo enlace directo de Quini 6: whatsapp://send?text=...&phone=...
      // El número y el mensaje están en el botón, que funciona también sin JavaScript.
      var espera = 20000;
      var respaldo = document.getElementById('respaldo');
      var contacto = document.getElementById('contacto');
      var redireccion = null;

      function cancelarRedireccion() {
        if (redireccion !== null) {
          window.clearTimeout(redireccion);
          redireccion = null;
        }
      }

      function abrirAutomaticamente() {
        redireccion = null;
        if (document.hidden) return;
        respaldo.hidden = false;
        try {
          window.location.href = contacto.href;
        } catch (error) {
          // Algunos navegadores exigen un toque para abrir una app externa.
          // El botón permanece visible y conserva su enlace directo.
        }
      }

      // No interceptamos el enlace: el toque abre WhatsApp mediante el navegador.
      contacto.addEventListener('click', cancelarRedireccion);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) cancelarRedireccion();
      });
      window.addEventListener('pagehide', cancelarRedireccion);

      redireccion = window.setTimeout(abrirAutomaticamente, espera);
    })();
  </script>
</body>
</html>
